name: CI RESTITUTION

# [1] WHEN IT RUNS — PRs, merges, a twice-monthly re-scan, and a manual button.
on:
  pull_request:
    branches: [development]
    paths:
      - "restitution-app/**"
      - "Database/**"
      - "restitution-app.Tests/**"
      - "Database.Tests/**"
      - ".github/workflows/ci-restitution.yml"
  push:
    branches: [development]
    paths:
      - "restitution-app/**"
      - "Database/**"
      - "restitution-app.Tests/**"
      - "Database.Tests/**"
      - ".github/workflows/ci-restitution.yml"
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code, write scan reports, nothing else
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE RUN AT A TIME — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — 'gate' is the exact check name branch protection requires green
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # [5] SETUP -> UI half (build) -> API half (compile) -> whole codebase (CodeQL + Trivy FS)
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
          queries: security-extended

      # ── UI HALF: build the Angular SPA (served by Caddy) ──
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: restitution-app/ClientApp/package-lock.json
      - working-directory: restitution-app/ClientApp
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm run buildprod

      # ── API HALF: compile the .NET app (no CSharpier gate on restitution) ──
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build restitution-app/restitution-app.sln -c Release

      # ── API HALF: run the unit tests — a failing test fails the gate ──
      - run: dotnet test restitution-app/restitution-app.sln -c Release --no-build

      # ── WHOLE CODEBASE: CodeQL writes its report — C# + TypeScript, one run ──
      - uses: github/codeql-action/analyze@v4

      # ── WHOLE CODEBASE: Trivy filesystem scan — CRITICAL/HIGH fail the gate ──
      - uses: aquasecurity/trivy-action@v0.36.0    # third-party — pin to commit SHA when hardening
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-ci-restitution-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-ci-restitution-fs.sarif
          category: trivy-ci-restitution-fs
