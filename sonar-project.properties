# SonarCloud configuration for BC Government Restitution Application
sonar.projectKey=bcgov_pssg-cscp-restitution
sonar.organization=bcgov-sonarcloud

# Project metadata
sonar.projectName=pssg-cscp-restitution
sonar.projectVersion=1.0

# Source code settings
sonar.sources=restitution-app/ClientApp/src,restitution-app/Controllers,restitution-app/Models,restitution-app/Services,restitution-app/ViewModels
sonar.tests=restitution-app/ClientApp/e2e

# File exclusions
sonar.exclusions=**/node_modules/**,**/wwwroot/**,**/bin/**,**/obj/**,**/*.min.js,**/*.min.css,**/ClientApp/dist/**,**/ClientApp/coverage/**

# Test exclusions
sonar.test.exclusions=**/*.spec.ts,**/*.spec.js,**/e2e/**/*.ts

